<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard — ShopMarkets</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=5">
  <style>
    .dash-layout { display: grid; grid-template-columns: 280px 1fr; gap: 30px; margin: 40px 0 80px; }
    .dash-sidebar { background: var(--aura-surface); border: 1px solid var(--aura-border); border-radius: var(--radius-md); padding: 24px; height: fit-content; }
    .dash-menu-btn { width: 100%; text-align: left; background: none; border: none; padding: 12px 16px; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.9rem; color: var(--aura-subtext); cursor: pointer; display: flex; align-items: center; gap: 10px; margin-bottom: 6px; transition: var(--transition); }
    .dash-menu-btn.active, .dash-menu-btn:hover { background: var(--aura-muted); color: var(--aura-text); }
    .dash-panel { background: var(--aura-surface); border: 1px solid var(--aura-border); border-radius: var(--radius-md); padding: 32px; }
    .order-card { border: 1px solid var(--aura-border); border-radius: var(--radius-sm); padding: 20px; margin-bottom: 16px; background: var(--aura-bg); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--aura-border); border-radius: var(--radius-sm); font-size: 0.9rem; outline: none; }
    @media (max-width: 768px) { .dash-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header class="main-header">
    <div class="container header-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon">SM</span>
        <span class="brand-name">ShopMarkets</span>
      </a>
      <a href="index.html" class="icon-btn" title="Back to Store"><i class="fas fa-store"></i></a>
    </div>
  </header>

  <main class="container">
    <div class="dash-layout">
      <!-- Sidebar -->
      <aside class="dash-sidebar">
        <div style="font-weight: 800; font-size: 1.1rem; margin-bottom: 20px;">Client Desk</div>
        <button class="dash-menu-btn active" onclick="showTab('orders', this)"><i class="fas fa-box"></i> Order History</button>
        <button class="dash-menu-btn" onclick="showTab('checkout', this)"><i class="fas fa-credit-card"></i> Direct Checkout</button>
      </aside>

      <!-- Main Content Area -->
      <section class="dash-panel">
        <!-- Orders View -->
        <div id="viewOrders">
          <h2 style="font-size: 1.3rem; margin-bottom: 20px;">Your ShopMarkets Orders</h2>
          <div id="ordersListContainer"></div>
        </div>

        <!-- Checkout View -->
        <div id="viewCheckout" style="display: none;">
          <h2 style="font-size: 1.3rem; margin-bottom: 20px;">Instant Checkout</h2>
          <form id="checkoutForm" onsubmit="handlePlaceOrder(event)">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="custName" required placeholder="Adnan Shah">
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input type="tel" id="custPhone" required placeholder="+91 98765 43210">
            </div>
            <div class="form-group">
              <label>Delivery Address</label>
              <textarea id="custAddress" rows="3" required placeholder="Street address, City, Pincode..."></textarea>
            </div>
            <div style="padding: 16px; background: var(--aura-muted); border-radius: var(--radius-sm); margin-bottom: 20px;">
              <div style="display: flex; justify-content: space-between; font-weight: 700;">
                <span>Payment Mode:</span>
                <span>Cash On Delivery (COD)</span>
              </div>
            </div>
            <button type="submit" class="btn-primary">Confirm & Place Order</button>
          </form>
        </div>
      </section>
    </div>
  </main>

  <script src="app.js?v=5"></script>
  <script>
    function showTab(tab, btn) {
      document.querySelectorAll('.dash-menu-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('viewOrders').style.display = tab === 'orders' ? 'block' : 'none';
      document.getElementById('viewCheckout').style.display = tab === 'checkout' ? 'block' : 'none';
    }

    function renderOrders() {
      const container = document.getElementById('ordersListContainer');
      const orders = getOrders();
      if (orders.length === 0) {
        container.innerHTML = `<p style="color: var(--aura-subtext);">No orders found. Explore our catalog and make your first order!</p>`;
        return;
      }
      container.innerHTML = orders.map(o => `
        <div class="order-card">
          <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
            <strong>Order #${o.id}</strong>
            <span style="color: var(--aura-accent); font-weight: 700;">${o.status || 'Processing'}</span>
          </div>
          <div style="font-size: 0.9rem; color: var(--aura-subtext); margin-bottom: 6px;">Placed on: ${o.date}</div>
          <div style="font-size: 0.95rem; font-weight: 700;">Total Amount: ₹${o.total.toLocaleString()}</div>
        </div>
      `).join('');
    }

    function handlePlaceOrder(e) {
      e.preventDefault();
      const cart = getCart();
      if (cart.length === 0) {
        alert("Your bag is empty! Please add products before placing an order.");
        return;
      }
      const total = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
      const newOrder = {
        id: 'SM-' + Math.floor(100000 + Math.random() * 900000),
        name: document.getElementById('custName').value,
        phone: document.getElementById('custPhone').value,
        address: document.getElementById('custAddress').value,
        items: cart,
        total: total,
        date: new Date().toLocaleDateString('en-IN'),
        status: 'Order Confirmed'
      };

      const orders = getOrders();
      orders.unshift(newOrder);
      saveOrders(orders);
      saveCart([]); // clear cart
      alert("Order placed successfully with ID: " + newOrder.id);
      showTab('orders', document.querySelector('.dash-menu-btn'));
      renderOrders();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderOrders();
      if (window.location.hash === '#checkout') {
        showTab('checkout', document.querySelectorAll('.dash-menu-btn')[1]);
      }
    });
  </script>
</body>
</html>
