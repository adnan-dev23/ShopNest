<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - ShoppingMarts99</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body.login-page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 60%, #312e81 100%);
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            padding: 40px 35px;
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .login-card .logo {
            font-size: 1.8rem;
            font-weight: 800;
            display: block;
            margin-bottom: 8px;
            text-decoration: none;
        }
        .login-card h2 {
            font-size: 1.2rem;
            color: var(--text-dark);
            margin-bottom: 22px;
            font-weight: 600;
        }
        .login-btn {
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            padding: 13px;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.4);
        }
        .back-link {
            display: inline-block;
            margin-top: 18px;
            color: var(--text-muted);
            font-size: 0.88rem;
            text-decoration: none;
        }
        .back-link:hover { color: var(--primary); }

        /* Discreet Secret Admin Area at the very bottom */
        .secret-admin-footer {
            margin-top: 35px;
            text-align: center;
        }
        .secret-admin-link {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.75rem;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }
        .secret-admin-link:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        /* Hidden Admin Popup */
        .admin-modal {
            position: fixed; inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; padding: 16px;
        }
        .admin-modal-card {
            background: #ffffff;
            padding: 30px;
            border-radius: var(--radius-lg);
            max-width: 360px;
            width: 100%;
            text-align: center;
            position: relative;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body class="login-page">

    <!-- 1. Main Customer Login Form (Top & Center) -->
    <div class="login-card">
        <a href="index.html" class="logo animated-text">ShoppingMarts99</a>
        <h2>Customer Sign In</h2>
        
        <form id="customerLoginForm">
            <div class="form-group" style="text-align: left;">
                <label for="custEmail"><i class="far fa-user"></i> Email or Mobile Number</label>
                <input type="text" id="custEmail" placeholder="Enter your email or phone" required>
            </div>
            <div class="form-group" style="text-align: left;">
                <label for="custPassword"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="custPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn">Sign In to My Dashboard</button>
        </form>

        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Return to Storefront</a>
    </div>

    <!-- 2. Secret Admin Access (Sabse niche discreet link) -->
    <div class="secret-admin-footer">
        <span class="secret-admin-link" onclick="openAdminGate()">Staff Portal</span>
    </div>

    <!-- 3. Hidden Admin Modal (Sirf secret click par khulega) -->
    <div id="adminModal" class="admin-modal hidden">
        <div class="admin-modal-card">
            <button class="close-btn" onclick="closeAdminGate()" style="top: 12px; right: 12px; width: 30px; height: 30px; font-size: 0.85rem;"><i class="fas fa-times"></i></button>
            <i class="fas fa-user-shield" style="font-size: 2.2rem; color: var(--primary); margin-bottom: 10px;"></i>
            <h3 style="font-size: 1.2rem; margin-bottom: 18px; color: var(--text-dark);">Admin Verification</h3>
            
            <form id="secretAdminForm">
                <div class="form-group" style="text-align: left;">
                    <label for="admUser" style="font-size: 0.8rem;">Admin ID</label>
                    <input type="text" id="admUser" placeholder="Username" required autocomplete="off">
                </div>
                <div class="form-group" style="text-align: left;">
                    <label for="admPass" style="font-size: 0.8rem;">Password</label>
                    <input type="password" id="admPass" placeholder="Password" required>
                </div>
                <button type="submit" class="login-btn" style="background: #0f172a; padding: 11px;">Verify & Unlock</button>
            </form>
        </div>
    </div>

    <script>
        // Customer Sign-in Action
        document.getElementById('customerLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const emailOrPhone = document.getElementById('custEmail').value.trim();
            sessionStorage.setItem('currentCustomer', emailOrPhone);
            window.location.href = 'customer.html';
        });

        // Secret Admin Authentication
        const ADMIN_ID = "adnan";
        const ADMIN_PASS = "adnan99";

        function openAdminGate() {
            document.getElementById('adminModal').classList.remove('hidden');
        }

        function closeAdminGate() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        document.getElementById('secretAdminForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('admUser').value.trim().toLowerCase();
            const pass = document.getElementById('admPass').value.trim();

            if (user === ADMIN_ID && pass === ADMIN_PASS) {
                localStorage.setItem('sm99_admin_auth', 'authenticated');
                window.location.href = 'admin.html';
            } else {
                alert('Invalid verification credentials!');
            }
        });
    </script>
</body>
</html>
