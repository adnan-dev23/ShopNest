<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Portal — ShopMarkets</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=5">
  <style>
    .auth-wrap { max-width: 420px; margin: 80px auto; background: var(--aura-surface); border: 1px solid var(--aura-border); border-radius: var(--radius-md); padding: 40px; box-shadow: var(--shadow-md); text-align: center; }
    .form-group { text-align: left; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 12px 14px; border: 1px solid var(--aura-border); border-radius: var(--radius-sm); font-size: 0.9rem; outline: none; }
  </style>
</head>
<body>

  <div class="auth-wrap">
    <div style="display:inline-flex; align-items:center; gap:8px; margin-bottom:24px;">
      <span class="brand-icon">SM</span>
      <span class="brand-name">ShopMarkets</span>
    </div>
    <h2 style="font-size:1.3rem; margin-bottom:8px;">Console Sign In</h2>
    <p style="color:var(--aura-subtext); font-size:0.85rem; margin-bottom:24px;">Enter staff credentials to manage ShopMarkets store.</p>

    <form onsubmit="handleAuth(event)">
      <div class="form-group">
        <label>Admin ID / Email</label>
        <input type="text" id="adminUser" required placeholder="admin@shopmarkets.com">
      </div>
      <div class="form-group">
        <label>Security Key</label>
        <input type="password" id="adminPass" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-primary" style="margin-top:10px;">Authenticate Access</button>
    </form>
  </div>

  <script>
    function handleAuth(e) {
      e.preventDefault();
      window.location.href = 'admin.html';
    }
  </script>
</body>
</html>
