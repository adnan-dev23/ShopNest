<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operations & Multi-Seller Management — ShopMarkets</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=6">
  <style>
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin: 30px 0; }
    .metric-card { background: var(--bg-surface); border: 1px solid var(--border-color); padding: 24px; border-radius: var(--radius-md); }
    .metric-card .label { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
    .metric-card .num { font-size: 1.8rem; font-weight: 800; }
    .data-table-wrap { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); overflow-x: auto; padding: 24px; margin-bottom: 40px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
    th, td { padding: 14px 16px; border-bottom: 1px solid var(--border-color); }
    th { font-weight: 800; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); }
  </style>
</head>
<body>

  <header class="main-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-wrap">
        <div class="brand-badge">SM</div>
        <div class="brand-text-block">
          <span class="brand-title">ShopMarkets</span>
          <span class="brand-tag">Operations Console</span>
        </div>
      </a>
      <a href="index.html" class="btn-hero-primary" style="padding: 8px 18px; font-size: 0.85rem;"><i class="fas fa-store"></i> Live Storefront</a>
    </div>
  </header>

  <main class="container">
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="label">Gross Merchandise Value</div>
        <div class="num" id="metricGMV">₹24,890</div>
      </div>
      <div class="metric-card">
        <div class="label">Active Dispatch Orders</div>
        <div class="num" id="metricOrders">1</div>
      </div>
      <div class="metric-card">
        <div class="label">Verified Sellers</div>
        <div class="num">2</div>
      </div>
      <div class="metric-card">
        <div class="label">Catalog SKU Count</div>
        <div class="num">6</div>
      </div>
    </div>

    <!-- Live Orders Table -->
    <div class="data-table-wrap">
      <h3 style="font-size: 1.15rem; font-weight: 800; margin-bottom: 16px;">Real-Time Dispatch Pipeline</h3>
      <table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer Address</th>
            <th>Value</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="adminLiveOrdersTbody"></tbody>
      </table>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script src="products.js"></script>
  <script src="app.js?v=6"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const orders = JSON.parse(localStorage.getItem('sm_customer_orders')) || [];
      const gmv = orders.reduce((acc, o) => acc + (o.total || 0), 0);
      document.getElementById('metricGMV').innerText = `₹${gmv.toLocaleString()}`;
      document.getElementById('metricOrders').innerText = orders.length;

      const tbody = document.getElementById('adminLiveOrdersTbody');
      if (orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-muted);">No live orders currently.</td></tr>`;
        return;
      }

      tbody.innerHTML = orders.map(o => `
        <tr>
          <td><strong>#${o.orderId}</strong></td>
          <td>${o.address || 'Address on file'}</td>
          <td>₹${o.total.toLocaleString()}</td>
          <td><span style="color: var(--accent-primary); font-weight: 700;">${o.status}</span></td>
          <td><button onclick="showToast('Courier airway bill generated!')" style="background:var(--bg-muted); padding:4px 10px; border-radius:4px; font-weight:700; font-size:0.75rem;">Generate AWB</button></td>
        </tr>
      `).join('');
    });
  </script>
</body>
</html>
