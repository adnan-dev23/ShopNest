<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Operations — ShopNest</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background-color: #09090b; color: #f8fafc; }
    .admin-container { max-width: 1240px; margin: 30px auto; padding: 0 20px; }
    .admin-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #18181b; border: 1px solid rgba(255,255,255,0.1);
      padding: 20px 25px; border-radius: var(--radius-md); margin-bottom: 25px;
    }
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 30px; }
    .metric-card {
      background: #18181b; border: 1px solid rgba(255,255,255,0.08);
      padding: 20px; border-radius: var(--radius-md); display: flex; align-items: center; gap: 16px;
    }
    .metric-card i { font-size: 2rem; }
    .metric-card p { font-size: 0.8rem; color: #a1a1aa; margin-bottom: 2px; }
    .metric-card h3 { font-size: 1.5rem; font-weight: 700; color: #ffffff; }
    
    .data-table-wrap {
      background: #18181b; border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-md); overflow: hidden; margin-bottom: 30px;
    }
    .table-title { padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 1.05rem; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; text-align: left; }
    th { background: #121215; padding: 12px 18px; color: #a1a1aa; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.08); }
    td { padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #e4e4e7; }
    tr:hover { background: rgba(255,255,255,0.02); }

    .status-select {
      background: #27272a; color: #ffffff; border: 1px solid rgba(255,255,255,0.15);
      padding: 6px 10px; border-radius: var(--radius-xs); font-family: inherit; font-size: 0.82rem; outline: none;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-bar">
      <div>
        <h1 style="font-size:1.35rem; font-weight:800;">ShopNest Admin Control</h1>
        <p style="font-size:0.8rem; color:#a1a1aa; margin-top:2px;">Live dispatch, sales metrics & order manager.</p>
      </div>
      <button class="cat-pill active" onclick="logoutAdmin()"><i class="fas fa-arrow-right-from-bracket"></i> Sign Out</button>
    </div>

    <!-- Live Performance Metrics -->
    <div class="metric-grid">
      <div class="metric-card">
        <i class="fas fa-bag-shopping" style="color:var(--aura-accent);"></i>
        <div>
          <p>Orders Received</p>
          <h3 id="statOrders">0</h3>
        </div>
      </div>
      <div class="metric-card">
        <i class="fas fa-indian-rupee-sign" style="color:var(--aura-success);"></i>
        <div>
          <p>Gross Value</p>
          <h3 id="statRevenue">₹0</h3>
        </div>
      </div>
      <div class="metric-card">
        <i class="fas fa-cart-shopping" style="color:#f59e0b;"></i>
        <div>
          <p>Active Bag Items</p>
          <h3 id="statCartCount">0</h3>
        </div>
      </div>
    </div>

    <!-- Orders Management Table -->
    <div class="data-table-wrap">
      <div class="table-title">Customer Placed Orders</div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Order ID & Date</th>
              <th>Customer</th>
              <th>Address</th>
              <th>Product Details</th>
              <th>Amount</th>
              <th>Dispatch Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="adminOrdersTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if (localStorage.getItem('shopnest_auth') !== 'authenticated') {
      window.location.replace('login.html');
    }

    function logoutAdmin() {
      localStorage.removeItem('shopnest_auth');
      window.location.replace('login.html');
    }

    function loadAdminDashboard() {
      const orders = getStorage('shopnest_orders', []);
      const tableBody = document.getElementById('adminOrdersTable');
      tableBody.innerHTML = '';

      let rev = 0;
      document.getElementById('statOrders').textContent = orders.length;

      if (orders.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:30px; color:#71717a;">No orders received yet.</td></tr>`;
      } else {
        orders.forEach((order, idx) => {
          rev += Number(order.price || 0);
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${order.orderId}</strong><br><small style="color:#a1a1aa;">${order.timestamp}</small></td>
            <td><strong>${order.name}</strong><br><span style="color:var(--aura-accent);">${order.phone}</span></td>
            <td>${order.address}<br><strong>PIN: ${order.pincode}</strong></td>
            <td>${order.productName}</td>
            <td><strong>₹${Number(order.price).toLocaleString('en-IN')}</strong></td>
            <td>
              <select class="status-select" onchange="updateStatus(${idx}, this.value)">
                <option value="Placed" ${order.status === 'Placed' ? 'selected' : ''}>Placed</option>
                <option value="Shipped" ${order.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                <option value="Out for Delivery" ${order.status === 'Out for Delivery' ? 'selected' : ''}>Out for Delivery</option>
                <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
              </select>
            </td>
            <td>
              <button onclick="removeOrder(${idx})" style="background:none; border:none; color:var(--aura-danger); cursor:pointer;"><i class="fas fa-trash"></i></button>
            </td>
          `;
          tableBody.appendChild(tr);
        });
      }

      document.getElementById('statRevenue').textContent = `₹${rev.toLocaleString('en-IN')}`;
      document.getElementById('statCartCount').textContent = getStorage('aura_cart', []).length;
    }

    window.updateStatus = function(index, newStatus) {
      const orders = getStorage('shopnest_orders', []);
      orders[index].status = newStatus;
      setStorage('shopnest_orders', orders);
      loadAdminDashboard();
    };

    window.removeOrder = function(index) {
      if (confirm('Delete this order?')) {
        const orders = getStorage('shopnest_orders', []);
        orders.splice(index, 1);
        setStorage('shopnest_orders', orders);
        loadAdminDashboard();
      }
    };

    document.addEventListener('DOMContentLoaded', loadAdminDashboard);
  </script>
</body>
</html>
