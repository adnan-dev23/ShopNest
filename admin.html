<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Operations Console — ShopMarkets</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css?v=5">
  <style>
    .admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 30px 0; }
    .stat-box { background: var(--aura-surface); border: 1px solid var(--aura-border); padding: 24px; border-radius: var(--radius-md); }
    .stat-box h3 { font-size: 0.85rem; color: var(--aura-subtext); margin-bottom: 8px; }
    .stat-box .val { font-size: 1.8rem; font-weight: 800; color: var(--aura-text); }
    .table-card { background: var(--aura-surface); border: 1px solid var(--aura-border); border-radius: var(--radius-md); overflow-x: auto; padding: 24px; margin-bottom: 40px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th, td { padding: 14px 16px; border-bottom: 1px solid var(--aura-border); }
    th { color: var(--aura-subtext); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; }
  </style>
</head>
<body>

  <header class="main-header">
    <div class="container header-container">
      <a href="index.html" class="brand-logo">
        <span class="brand-icon">SM</span>
        <span class="brand-name">ShopMarkets Console</span>
      </a>
      <a href="index.html" class="icon-btn" title="Exit to Store"><i class="fas fa-arrow-right-from-bracket"></i></a>
    </div>
  </header>

  <main class="container">
    <div class="admin-stats">
      <div class="stat-box">
        <h3>Total Live Orders</h3>
        <div class="val" id="totalOrdersCount">0</div>
      </div>
      <div class="stat-box">
        <h3>Gross Revenue</h3>
        <div class="val" id="totalRevenue">₹0</div>
      </div>
      <div class="stat-box">
        <h3>Catalog Items</h3>
        <div class="val" id="totalProducts">6</div>
      </div>
    </div>

    <div class="table-card">
      <h2 style="font-size: 1.2rem; margin-bottom: 16px;">Recent ShopMarkets Client Orders</h2>
      <table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Contact</th>
            <th>Amount</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="adminOrdersTable"></tbody>
      </table>
    </div>
  </main>

  <script src="app.js?v=5"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const orders = getOrders();
      const products = getProducts();
      
      document.getElementById('totalOrdersCount').innerText = orders.length;
      document.getElementById('totalProducts').innerText = products.length;

      const rev = orders.reduce((acc, o) => acc + (o.total || 0), 0);
      document.getElementById('totalRevenue').innerText = `₹${rev.toLocaleString()}`;

      const tbody = document.getElementById('adminOrdersTable');
      if (orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--aura-subtext);">No orders placed yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = orders.map(o => `
        <tr>
          <td><strong>${o.id}</strong></td>
          <td>${o.name || 'Guest'}</td>
          <td>${o.phone || 'N/A'}</td>
          <td>₹${o.total.toLocaleString()}</td>
          <td><span style="color: var(--aura-accent); font-weight:700;">${o.status || 'Active'}</span></td>
        </tr>
      `).join('');
    });
  </script>
</body>
</html>
